<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite wird überarbeitet</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Entwicklung im Gange</h1>
    <p>An dieser Website wird gerade gearbeitet. Es kann zu Darstellungsfehlern kommen.</p>
    <a href="index.html?bypass=true" class="btn">Seite trotzdem besuchen</a>
  </div>
</body>
</html>
