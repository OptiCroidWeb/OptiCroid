<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite wird überarbeitet</title>
  <script>
    if (!sessionStorage.getItem('wartung_active')) {
      location.replace('index.html');
    }
  </script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #180808;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card {
      background: #2b1212;
      padding: 2.5rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
      border: 1px solid #7f1d1d;
    }
    .warning-icon {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      display: block;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #451a1a;
      border-top-color: #ef4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1rem auto 1.5rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 1.35rem; margin-bottom: 0.5rem; color: #fca5a5; }
    p { color: #fca5a5; opacity: 0.8; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
    .btn {
      background-color: #ef4444;
      color: #ffffff;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <span class="warning-icon">⚠️</span>
    <h1>Entwicklung im Gange</h1>
    <div class="spinner"></div>
    <p>An dieser Website wird gerade gearbeitet. Es kann zu Darstellungsfehlern kommen.</p>
    <a href="index.html?bypass=true" class="btn">Seite trotzdem besuchen</a>
  </div>
</body>
</html>
