<head>

  <style>
    /* Globales Reset & Schriftart */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body { 
      width: 100%; 
      background-color: #0f172a; /* Haupt-Blau (Dunkelblau/Slate) */
      color: #ffffff; /* Haupt-Weiß */
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      overflow-x: hidden; 
    }

    main { 
      padding: 40px 15px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 30px; 
      width: 100%; 
    }

    /* Hauptkarte / Content Container */
    .content { 
      display: block; 
      text-align: center; 
      background-color: #1e293b; /* Kontrastierendes Dunkelblau */
      width: 100%; 
      max-width: 750px; 
      border-radius: 24px; 
      padding: 35px 25px; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin: 0 auto;
      position: relative;
    }

    img { max-width: 100%; height: auto; }

    /* Titel & Typography */
    .title-main {
      color: #ffffff;
      font-size: clamp(22px, 5vw, 36px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title-accent {
      color: #ff7043; /* Accent Orange */
    }

    /* Logo Style */
    .profile-logo {
      width: 180px; 
      height: 180px;
      object-fit: cover;
      border-radius: 50%; 
      border: 4px solid #ff7043; /* Orange Rahmung */
      box-shadow: 0 8px 25px rgba(255, 112, 67, 0.25);
      margin: 20px 0;
      transition: transform 0.3s ease;
    }

    .profile-logo:hover {
      transform: scale(1.03);
    }

    /* Anrufen Button Styles */
    #call-btn { 
      border: none; 
      color: #ffffff; 
      padding: 14px 35px; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 1.1rem;
      text-decoration: none; 
      margin: 15px 0; 
      display: inline-block; 
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-green { 
      background-color: #10b981; 
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4) !important;
    }

    .btn-red { 
      background-color: #ef4444; 
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3) !important;
    }

    /* Info Bar & Standorts-Box */
    .info-card {
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 15px 20px; 
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin: 20px 0;
    }

    /* Features / Leistungen Tag Grid (NEU) */
    .services-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
    }

    .service-tag {
      background: rgba(255, 112, 67, 0.1);
      border: 1px solid rgba(255, 112, 67, 0.3);
      color: #ff7043;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Popover Details Elements */
    details {
      position: relative;
    }

    summary {
      cursor: pointer; 
      list-style: none; 
      font-weight: 700; 
      text-align: center;
      user-select: none;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .pill-btn {
      border: 2px solid #ff7043;
      color: #ffffff;
      padding: 8px 20px; 
      border-radius: 50px; 
      display: inline-block; 
      background: rgba(255, 112, 67, 0.15);
      transition: background 0.3s ease;
    }

    .pill-btn:hover {
      background: rgba(255, 112, 67, 0.3);
    }

    .dropdown-popover {
      position: absolute; 
      left: 50%; 
      transform: translateX(-50%); 
      top: 120%; 
      padding: 15px; 
      background: #0f172a; 
      border: 1px solid #ff7043; 
      border-radius: 16px; 
      text-align: left; 
      color: #ffffff; 
      font-size: 0.9em; 
      width: 240px; 
      z-index: 100; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    /* Notification Box Overlay */
    #notification-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 2000;
    }

    .notification-box {
      background: #1e293b; color: #ffffff; padding: 30px; border-radius: 20px;
      text-align: center; width: 85%; max-width: 350px;
      border: 1px solid #ff7043;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .notification-box button {
      margin-top: 20px; background: #ff7043; color: white; border: none;
      padding: 10px 30px; border-radius: 50px; font-weight: bold; cursor: pointer;
    }

    /* Status Farben */
    .orange { color: #ff7043; font-weight: 600; }
    .normal { color: inherit; }

    @media (max-width: 768px) {
      .content { padding: 25px 15px; }
    }
  </style>

<body>

  <main>
    <section id="liveBild" class="content" style="display: none; background: linear-gradient(135deg, #ff7043, #0f172a); border: 1px solid rgba(255,255,255,0.2); padding: 0;">
      <details style="width: 100%;">
        <summary style="padding: 15px; color: #ffffff; display: flex; justify-content: space-between; align-items: center;">
          <span>Kein Eintrag</span>
          <span>▼</span>
        </summary>
        <div style="padding: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden;">
          <img src="IMG_0002.png" id="tutorial-img" onclick="toggleZoom(this)" style="width: 100%; border-radius: 12px; cursor: zoom-in; transition: transform 0.3s ease;" alt="Tutorial">
        </div>
      </details>
    </section>

    <section id="startseite" class="content">
      
      <h1 class="title-main">
        IT Hilfe <span class="title-accent">OptiCroid</span>
      </h1>

      <img src="Logo.png" class="profile-logo" alt="OptiCroid Logo"/><br>

      <a href="tel:+4915206821179" id="call-btn">Anrufen</a>

      <div class="services-grid">
        <span class="service-tag">PC & Smartphone Hilfe</span>
        <span class="service-tag">Spendenbasis</span>
        <span class="service-tag">Vor-Ort-Service</span>
      </div>

      <div class="info-card">
        <div style="text-align: left;">
          <strong style="color: #ffffff;">Umkreis:</strong> Steingaden<br>
          <small style="color: #ff7043; font-weight: 600;">~ 5 Min. Anfahrt</small>
        </div>
        <img src="Screenshot_20260420_161537_Google.jpg" alt="Standortkarte" style="width: 75px; height: 55px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);">
      </div>

      <div style="padding: 10px 0; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
        
        <details>
          <summary>
            <span class="pill-btn">Infos ▼</span>
          </summary>
          <div class="dropdown-popover">
            <strong style="color: #ff7043;">Betriebsurlaub:</strong><br>
            03.08.2026 - 14.08.2026
          </div>
        </details>

        <details>
          <summary>
            <span id="status-text" class="pill-btn">Prüfe... ▼</span>
          </summary> 
          <table id="opening-table" class="dropdown-popover" style="width: 240px; border-collapse: collapse;">
          </table>
        </details>

      </div>
    </section>
  </main>

  <script>
    function toggleZoom(img) {
      if (img.style.transform === "scale(2)") {
        img.style.transform = "scale(1)";
        img.style.cursor = "zoom-in";
      } else {
        img.style.transform = "scale(2)";
        img.style.cursor = "zoom-out";
      }
    }

    const schedule = [
      { day: "Sonntag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Montag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Dienstag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Mittwoch", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Donnerstag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Freitag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' },
      { day: "Samstag", open: 0, close: 0, label: '<span class="orange">geschlossen</span>' }
    ];

    function updateStatus() {
      const now = new Date();
      const currentTime = now.getHours() + now.getMinutes() / 60;
      const currentDayIdx = now.getDay(); 
      const today = schedule[currentDayIdx];
      const isOpen = today.open !== 0 && currentTime >= today.open && currentTime < today.close;

      const statusEl = document.getElementById('status-text');
      const callBtn = document.getElementById('call-btn');

      if (isOpen) {
          statusEl.innerHTML = `<span style="color: #10b981">Geöffnet</span> ▼`;
          callBtn.className = "btn-green";
          callBtn.onclick = null;
      } else {
          statusEl.innerHTML = `<span style="color: #ef4444">Geschlossen</span> ▼`;
          callBtn.className = "btn-red";
          callBtn.onclick = function(e) { e.preventDefault(); alert("Aktuell geschlossen."); };
      }

      let displayOrder = [1, 2, 3, 4, 5, 6, 0];
      let tableHtml = "";

      displayOrder.forEach(idx => {
        const item = schedule[idx];
        const isToday = idx === currentDayIdx;
        tableHtml += `
          <tr style="border-bottom: 1px solid rgba(255,255,255,0.08); ${isToday ? 'background:rgba(255,112,67,0.15)' : ''}">
            <td style="padding: 8px 6px;">${item.day}</td>
            <td style="padding: 8px 6px; text-align: right;">${item.label}</td>
          </tr>`;
      });
      document.getElementById('opening-table').innerHTML = tableHtml;
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>
