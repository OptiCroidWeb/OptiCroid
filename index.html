<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="1h0mJmEKKiB0WFa2w9Txokx6s4TYYGrI54m2dTZAwCk" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IT Hilfe - OptiCroid</title>
  
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="stylesheet" href="seasonal.css">
  <script src="seasonal.js" defer></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      border: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      width: 100%; 
      min-height: 100vh;
      color: #f1f5f9; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      background-color: #0b0f17;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Container Spacing */
    main {
      width: 100%;
      max-width: 680px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin: 40px 0;
    }

    /* Header Section */
    .hero-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .title-main {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .title-accent {
      transition: all 0.5s ease;
      background: linear-gradient(135deg, var(--season-accent, #38bdf8), #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 12px var(--season-glow, rgba(56, 189, 248, 0.4)));
    }

    /* Avatar / Logo Glow Container */
    .logo-wrapper {
      position: relative;
      margin: 8px 0;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--season-accent, #38bdf8), transparent);
      opacity: 0.6;
      filter: blur(12px);
      transition: opacity 0.4s ease;
    }

    .profile-logo {
      position: relative;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%; 
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .profile-logo:hover {
      transform: scale(1.06) rotate(3deg);
    }

    /* Primary Action Button */
    #call-btn { 
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #ffffff; 
      padding: 16px 48px; 
      border-radius: 100px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 1.1rem;
      text-decoration: none; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .btn-green { 
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-green:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(16, 185, 129, 0.5);
    }

    .btn-red { 
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 8px 25px rgba(239, 68, 68, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Modern Glass Cards */
    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Services Grid */
    .services-grid {
      display: flex; 
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .service-tag {
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.25s ease;
    }

    .service-tag:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Info Bar (Umkreis & Map) */
    .info-card {
      width: 100%;
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 24px; 
    }

    .map-thumbnail {
      width: 64px; 
      height: 52px; 
      object-fit: cover; 
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Accordion Custom Styling */
    .accordion-container {
      display: flex; 
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    details {
      width: 100%; 
      border-radius: 16px;
      overflow: hidden;
    }

    summary {
      cursor: pointer; 
      list-style: none; 
      font-weight: 600; 
      text-align: center; 
      user-select: none;
      padding: 16px 20px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      transition: background 0.2s ease;
    }

    summary::-webkit-details-marker { display: none; }

    summary:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .accordion-content {
      padding: 16px 20px; 
      background: rgba(0, 0, 0, 0.25);
      text-align: center;
      color: #94a3b8;
      font-size: 0.9rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .opening-table {
      width: 100%; 
      max-width: 340px;
      margin: 0 auto;
      border-collapse: collapse;
    }

    .opening-table td {
      padding: 8px 10px;
      font-size: 0.88rem;
    }

    /* Live Pulse Dot */
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 10px currentColor;
    }

    /* Intro Animations */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile Tweaks */
    @media (max-width: 480px) {
      body { padding: 12px; }
      #call-btn { width: 100%; justify-content: center; }
      .info-card { padding: 14px 18px; }
    }
  </style>

  <script src="https://minnit.chat/js/embed.js?c=1772345192" defer></script>
</head>
<body>

  <!-- Minimalist Season Badge -->
  <div id="season-badge">
    <span class="badge-dot"></span>
    <span id="season-text">SYSTEM ACTIVE</span>
  </div>

  <main>
    <!-- Hero Header -->
    <header class="hero-header fade-in delay-1">
      <h1 class="title-main">
        IT Hilfe <span class="title-accent">OptiCroid</span>
      </h1>
      
      <div class="logo-wrapper">
        <img src="Logo.png" class="profile-logo" alt="OptiCroid Logo"/>
      </div>
    </header>

    <!-- Main Call Button -->
    <div class="fade-in delay-2" style="width: 100%; text-align: center;">
      <a href="tel:+4915206821179" id="call-btn">
        <span>Anrufen</span>
      </a>
    </div>

    <!-- Service Tags -->
    <div class="services-grid fade-in delay-3">
      <span class="service-tag">PC & Komplexe Systeme</span>
      <span class="service-tag">Spendenbasis</span>
      <span class="service-tag">Service</span>
    </div>

    <!-- Location Card -->
    <div class="info-card glass-card fade-in delay-4">
      <div style="text-align: left;">
        <div style="color: #64748b; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Standort</div>
        <strong style="color: #ffffff; font-size: 1.05rem;">Steingaden</strong>
        <div class="accent-color" style="font-size: 0.85rem; font-weight: 600; margin-top: 2px;">~ 5 Min. Anfahrt</div>
      </div>
      <img src="Screenshot_20260420_161537_Google.jpg" alt="Standortkarte" class="map-thumbnail">
    </div>

    <!-- Accordion Info & Opening Hours -->
    <div class="accordion-container fade-in delay-4">
      
      <details class="glass-card">
        <summary>Info ▼</summary>
        <div class="accordion-content">
          
        </div>
      </details>

      <details class="glass-card">
        <summary id="status-text">
          <span>Öffnungszeiten prüfen...</span> ▼
        </summary>
        <div class="accordion-content">
          <table id="opening-table" class="opening-table"></table>
        </div>
      </details>

    </div>
  </main>

  <script>
    const schedule = [
      { day: "Sonntag", open: 0, close: 0, label: '<span style="color:#94a3b8">Geschlossen</span>' },
      { day: "Montag", open: 9.5, close: 18, label: '09:30 - 18:00' },
      { day: "Dienstag", open: 9.5, close: 18, label: '09:30 - 18:00' },
      { day: "Mittwoch", open: 9.5, close: 18, label: '09:30 - 18:00' },
      { day: "Donnerstag", open: 9.5, close: 18, label: '09:30 - 18:00' },
      { day: "Freitag", open: 9.5, close: 18, label: '09:30 - 18:00' },
      { day: "Samstag", open: 9.5, close: 18, label: '09:30 - 18:00' }
    ];

    function updateStatus() {
      const now = new Date();
      const currentTime = now.getHours() + now.getMinutes() / 60;
      const currentDayIdx = now.getDay(); 
      const today = schedule[currentDayIdx];
      const isOpen = today.open !== 0 && currentTime >= today.open && currentTime < today.close;

      const statusEl = document.getElementById('status-text');
      const callBtn = document.getElementById('call-btn');

      if (isOpen) {
          statusEl.innerHTML = `<span class="pulse-dot" style="background:#10b981; color:#10b981;"></span><span style="color: #34d399; font-weight:700;">Jetzt Geöffnet</span> <small style="color:#64748b; margin-left:4px;">▼</small>`;
          callBtn.className = "btn-green";
          callBtn.onclick = null;
      } else {
          statusEl.innerHTML = `<span class="pulse-dot" style="background:#ef4444; color:#ef4444;"></span><span style="color: #f87171; font-weight:700;">Aktuell Geschlossen</span> <small style="color:#64748b; margin-left:4px;">▼</small>`;
          callBtn.className = "btn-red";
          callBtn.onclick = function(e) { e.preventDefault(); alert("Wir haben aktuell geschlossen. Rufen Sie gerne während der Öffnungszeiten an!"); };
      }

      let displayOrder = [1, 2, 3, 4, 5, 6, 0];
      let tableHtml = "";
      displayOrder.forEach(idx => {
        const item = schedule[idx];
        const isToday = idx === currentDayIdx;
        tableHtml += `
          <tr style="${isToday ? 'background:rgba(255,255,255,0.08); font-weight:bold; color:#fff;' : ''}">
            <td style="text-align: left;">${item.day}</td>
            <td style="text-align: right; color: ${isToday ? '#38bdf8' : '#cbd5e1'};">${item.label}</td>
          </tr>`;
      });
      document.getElementById('opening-table').innerHTML = tableHtml;
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>
