<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="1h0mJmEKKiB0WFa2w9Txokx6s4TYYGrI54m2dTZAwCk" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Hilfe-OptiCroid</title>
  
  <link rel="icon" type="image/png" href="Logo.png">

  <link rel="stylesheet" href="seasonal.css">
  <script src="seasonal.js" defer></script>

  <style>
    /* Globales Reset & Schriftart */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      border: none;
      outline: none;
    }

    body { 
      width: 100%; 
      background-color: #0f172a; 
      color: #ffffff; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      overflow-x: hidden;
    }

    main { 
      padding: 20px 10px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 15px; 
      width: 100%; 
    }

    /* Hauptkarte (kompakter gestaltet) */
    .content { 
      display: block; 
      text-align: center; 
      background-color: #1e293b; 
      width: 100%; 
      max-width: 580px; 
      border-radius: 18px; 
      padding: 22px 18px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.4); 
      margin: 0 auto;
      position: relative;
    }

    img { max-width: 100%; height: auto; }

    /* Titel */
    .title-main {
      color: #ffffff;
      font-size: clamp(20px, 4.5vw, 30px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .title-accent {
      color: #ff7043;
      transition: color 0.4s ease;
    }

    /* Logo (deutlich verkleinert) */
    .profile-logo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%; 
      box-shadow: 0 6px 20px rgba(255, 112, 67, 0.2);
      margin: 12px 0;
      transition: transform 0.3s ease;
    }

    .profile-logo:hover {
      transform: scale(1.03);
    }

    /* Anrufen Button */
    #call-btn { 
      color: #ffffff; 
      padding: 10px 26px; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 0.95rem;
      text-decoration: none; 
      margin: 10px 0; 
      display: inline-block; 
      transition: all 0.3s ease;
    }

    .btn-green { 
      background-color: #10b981; 
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4) !important;
    }

    .btn-red { 
      background-color: #ef4444; 
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3) !important;
    }

    /* Info Bar / Standort */
    .info-card {
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 14px; 
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin: 12px 0;
      font-size: 0.85rem;
    }

    /* Features / Leistungen Tag Grid */
    .services-grid {
      display: flex; 
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin: 12px 0;
    }

    .service-tag {
      background: rgba(255, 112, 67, 0.15);
      color: #ff7043;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.4s ease;
    }

    /* Ausklappbare Abschnitte */
    .accordion-container {
      display: flex; 
      flex-direction: column;
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }

    details {
      width: 100%; 
      background: rgba(255, 112, 67, 0.15);
      border-radius: 12px;
      overflow: hidden;
      transition: background 0.3s ease;
    }

    details[open] {
      background: rgba(255, 112, 67, 0.2);
    }

    summary {
      cursor: pointer; 
      list-style: none; 
      font-weight: 700; 
      text-align: center; 
      user-select: none;
      padding: 10px 14px;
      color: #ffffff;
      width: 100%;
      display: block;
      font-size: 0.9rem;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    /* Inhalt beim Ausklappen */
    .accordion-content {
      padding: 10px 14px; 
      background: #0f172a;
      text-align: center;
      color: #ffffff;
      font-size: 0.85em;
    }

    .opening-table {
      width: 100%; 
      max-width: 280px;
      margin: 0 auto;
      border-collapse: collapse;
    }

    .opening-table td {
      padding: 6px;
    }

    /* Status Farben */
    .orange { color: #ff7043; font-weight: 600; }
    .normal { color: #ffffff; }

    @media (max-width: 480px) {
      .content { padding: 18px 12px; }
      .info-card { gap: 8px; }
    }
  </style>

  <script src="https://minnit.chat/js/embed.js?c=1772345192" defer></script>
</head>
<body>

  <main>
    <section id="liveBild" class="content" style="display: none; background: linear-gradient(135deg, #ff7043, #0f172a); padding: 0;">
      <details style="width: 100%;">
        <summary style="padding: 12px; color: #ffffff; display: flex; justify-content: space-between; align-items: center;">
          <span>Kein Eintrag</span>
          <span>▼</span>
        </summary>
        <div style="padding: 15px; overflow: hidden;">
          <img src="IMG_0002.png" id="tutorial-img" onclick="toggleZoom(this)" style="width: 100%; border-radius: 10px; cursor: zoom-in; transition: transform 0.3s ease;" alt="Tutorial">
        </div>
      </details>
    </section>

    <section id="startseite" class="content">
      
      <h1 class="title-main">
        IT Hilfe <span class="title-accent">OptiCroid</span>
      </h1>

      <img src="Logo.png" class="profile-logo" alt="OptiCroid Logo"/><br>

      <a href="tel:+4915206821179" id="call-btn">Anrufen</a>

      <div class="services-grid">
        <span class="service-tag">PC & Komplexe Systeme</span>
        <span class="service-tag">Spendenbasis</span>
        <span class="service-tag">Vor-Ort-Service</span>
      </div>

      <div class="info-card">
        <div style="text-align: left;">
          <strong style="color: #ffffff;">Umkreis:</strong> Steingaden<br>
          <small style="color: #ff7043; font-weight: 600;">~ 5 Min. Anfahrt</small>
        </div>
        <img src="Screenshot_20260420_161537_Google.jpg" alt="Standortkarte" style="width: 60px; height: 45px; object-fit: cover; border-radius: 8px;">
      </div>

      <div class="accordion-container">
        
        <details>
          <summary>Infos ▼</summary>
          <div class="accordion-content">
            <strong style="color: #ff7043;"></strong><br>
            
          </div>
        </details>

        <details>
          <summary id="status-text">Prüfe... ▼</summary>
          <div class="accordion-content">
            <table id="opening-table" class="opening-table">
            </table>
          </div>
        </details>

      </div>
    </section>
  </main>

  <script>
    function toggleZoom(img) {
      if (img.style.transform === "scale(2)") {
        img.style.transform = "scale(1)";
        img.style.cursor = "zoom-in";
      } else {
        img.style.transform = "scale(2)";
        img.style.cursor = "zoom-out";
      }
    }

    const schedule = [
      { day: "Sonntag", open: 0, close: 0, label: '<span class="normal">geschlossen</span>' },
      { day: "Montag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Dienstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Mittwoch", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Donnerstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Freitag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Samstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' }
    ];

    function updateStatus() {
      const now = new Date();
      const currentTime = now.getHours() + now.getMinutes() / 60;
      const currentDayIdx = now.getDay(); 
      const today = schedule[currentDayIdx];
      const isOpen = today.open !== 0 && currentTime >= today.open && currentTime < today.close;

      const statusEl = document.getElementById('status-text');
      const callBtn = document.getElementById('call-btn');

      if (isOpen) {
          statusEl.innerHTML = `<span style="color: #10b981">Geöffnet</span> ▼`;
          callBtn.className = "btn-green";
          callBtn.onclick = null;
      } else {
          statusEl.innerHTML = `<span style="color: #ef4444">Geschlossen</span> ▼`;
          callBtn.className = "btn-red";
          callBtn.onclick = function(e) { e.preventDefault(); alert("Aktuell geschlossen."); };
      }

      let displayOrder = [1, 2, 3, 4, 5, 6, 0];
      let tableHtml = "";
      displayOrder.forEach(idx => {
        const item = schedule[idx];
        const isToday = idx === currentDayIdx;
        tableHtml += `
          <tr style="${isToday ? 'background:rgba(255,112,67,0.15); border-radius: 6px;' : ''}">
            <td style="text-align: left;">${item.day}</td>
            <td style="text-align: right;">${item.label}</td>
          </tr>`;
      });
      document.getElementById('opening-table').innerHTML = tableHtml;
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>

</body>
</html>
