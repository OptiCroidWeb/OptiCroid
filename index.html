<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="1h0mJmEKKiB0WFa2w9Txokx6s4TYYGrI54m2dTZAwCk" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Hilfe - OptiCroid</title>
  
  <link rel="icon" type="image/png" href="Logo.png">
  <link rel="stylesheet" href="seasonal.css">
  <script src="seasonal.js" defer></script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      border: none;
      outline: none;
    }

    body { 
      width: 100%; 
      color: #ffffff; 
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
      overflow-x: hidden;
      min-height: 100vh;
    }

    img { max-width: 100%; height: auto; }

    /* Titel */
    .title-main {
      color: #ffffff;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 5px;
    }

    /* Logo mit Umrandungs-Glow */
    .profile-logo {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 50%; 
      margin: 15px 0;
      transition: transform 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .profile-logo:hover {
      transform: scale(1.04);
    }

    /* Call Button */
    #call-btn { 
      color: #ffffff; 
      padding: 12px 32px; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: 700; 
      font-size: 1rem;
      text-decoration: none; 
      margin: 12px 0; 
      display: inline-block; 
      transition: all 0.3s ease;
    }

    .btn-green { 
      background-color: #10b981; 
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4) !important;
    }

    .btn-red { 
      background-color: #ef4444; 
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3) !important;
    }

    /* Info Bar / Standort */
    .info-card {
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 12px 18px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      margin: 16px 0;
      font-size: 0.9rem;
    }

    /* Services Tag Grid */
    .services-grid {
      display: flex; 
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin: 16px 0;
    }

    .service-tag {
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.4s ease;
    }

    /* Akkordeon Element */
    .accordion-container {
      display: flex; 
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 15px;
    }

    details {
      width: 100%; 
      border-radius: 14px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    summary {
      cursor: pointer; 
      list-style: none; 
      font-weight: 700; 
      text-align: center; 
      user-select: none;
      padding: 12px 18px;
      color: #ffffff;
      width: 100%;
      display: block;
      font-size: 0.95rem;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .accordion-content {
      padding: 12px 18px; 
      background: rgba(0, 0, 0, 0.25);
      text-align: center;
      color: #ffffff;
      font-size: 0.9em;
    }

    .opening-table {
      width: 100%; 
      max-width: 300px;
      margin: 0 auto;
      border-collapse: collapse;
    }

    .opening-table td {
      padding: 6px;
    }

    .normal { color: #ffffff; }
  </style>

  <script src="https://minnit.chat/js/embed.js?c=1772345192" defer></script>
</head>
<body>

  <main>
    <section id="startseite" class="content">
      
      <h1 class="title-main">
        IT Hilfe <span class="title-accent">OptiCroid</span>
      </h1>

      <img src="Logo.png" class="profile-logo" alt="OptiCroid Logo"/><br>

      <a href="tel:+4915206821179" id="call-btn">Anrufen</a>

      <div class="services-grid">
        <span class="service-tag">PC & Komplexe Systeme</span>
        <span class="service-tag">Spendenbasis</span>
        <span class="service-tag">Vor-Ort-Service</span>
      </div>

      <div class="info-card">
        <div style="text-align: left;">
          <strong style="color: #ffffff;">Umkreis:</strong> Steingaden<br>
          <small class="accent-color" style="font-weight: 600;">~ 5 Min. Anfahrt</small>
        </div>
        <img src="Screenshot_20260420_161537_Google.jpg" alt="Standortkarte" style="width: 65px; height: 48px; object-fit: cover; border-radius: 8px;">
      </div>

      <div class="accordion-container">
        
        <details>
          <summary>Infos ▼</summary>
          <div class="accordion-content">
            <strong class="accent-color"></strong><br>
            
          </div>
        </details>

        <details>
          <summary id="status-text">Prüfe... ▼</summary>
          <div class="accordion-content">
            <table id="opening-table" class="opening-table">
            </table>
          </div>
        </details>

      </div>
    </section>
  </main>

  <script>
    const schedule = [
      { day: "Sonntag", open: 0, close: 0, label: '<span class="normal">geschlossen</span>' },
      { day: "Montag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Dienstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Mittwoch", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Donnerstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Freitag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' },
      { day: "Samstag", open: 9.5, close: 18, label: '<span class="normal">9:30 - 18:00</span>' }
    ];

    function updateStatus() {
      const now = new Date();
      const currentTime = now.getHours() + now.getMinutes() / 60;
      const currentDayIdx = now.getDay(); 
      const today = schedule[currentDayIdx];
      const isOpen = today.open !== 0 && currentTime >= today.open && currentTime < today.close;

      const statusEl = document.getElementById('status-text');
      const callBtn = document.getElementById('call-btn');

      if (isOpen) {
          statusEl.innerHTML = `<span style="color: #10b981">Geöffnet</span> ▼`;
          callBtn.className = "btn-green";
          callBtn.onclick = null;
      } else {
          statusEl.innerHTML = `<span style="color: #ef4444">Geschlossen</span> ▼`;
          callBtn.className = "btn-red";
          callBtn.onclick = function(e) { e.preventDefault(); alert("Aktuell geschlossen."); };
      }

      let displayOrder = [1, 2, 3, 4, 5, 6, 0];
      let tableHtml = "";
      displayOrder.forEach(idx => {
        const item = schedule[idx];
        const isToday = idx === currentDayIdx;
        tableHtml += `
          <tr style="${isToday ? 'background:rgba(255,255,255,0.1); border-radius: 6px;' : ''}">
            <td style="text-align: left;">${item.day}</td>
            <td style="text-align: right;">${item.label}</td>
          </tr>`;
      });
      document.getElementById('opening-table').innerHTML = tableHtml;
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>
</body>
</html>
